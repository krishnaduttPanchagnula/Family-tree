name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install CGO build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install cross-compilers
        run: |
            sudo apt-get update
            sudo apt-get install -y \
              gcc-aarch64-linux-gnu \
              mingw-w64

      - name: Test
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CC_aarch64_linux: aarch64-linux-gnu-gcc
          CXX_aarch64_linux: aarch64-linux-gnu-g++
          CGO_ENABLED: "1"

      # The release notes come from the CHANGELOG section for this tag, so
      # they list the features instead of the commit list.
      - name: Write the release notes from the changelog
        run: |
          NOTES=$(awk -v tag="${GITHUB_REF_NAME}" '
            $0 == "## " tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -n "$NOTES" ]; then
            echo "Using the CHANGELOG section for ${GITHUB_REF_NAME} as the release notes"
            gh release edit "${GITHUB_REF_NAME}" --notes "${NOTES}"
          else
            echo "No CHANGELOG section for ${GITHUB_REF_NAME}; keeping the generated notes"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
