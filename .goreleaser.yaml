version: 2

project_name: familytree

before:
  hooks:
    - go mod download

builds:
  - id: familytree
    main: ./main.go
    binary: familytree
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X main.commit={{ .Commit }}
        -X main.date={{ .Date }}
        -X main.repository={{ .Env.GITHUB_REPOSITORY }}

archives:
  - id: familytree
    ids:
      - familytree
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc

release:
  prerelease: auto
